services:
  mongo:
    image: mongo:7
    container_name: servicehive_mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - servicehive_network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: servicehive_server
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/servicehive
      - JWT_SECRET=servicehive_super_secret_key_2024
      - JWT_EXPIRES_IN=7d
      - NODE_ENV=production
    depends_on:
      - mongo
    networks:
      - servicehive_network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: servicehive_client
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      - server
    networks:
      - servicehive_network

volumes:
  mongo_data:

networks:
  servicehive_network:
    driver: bridge